# prek / pre-commit hooks for bio-packages.
# Verify locally with `prek run --all-files`.
# Install the git hooks once with:
#   prek install --install-hooks
default_install_hook_types: [pre-commit, commit-msg]

# Recorded API responses, input data, stored fixtures and rendered decks are
# artifacts, not source. Hooks must not rewrite them.
exclude: ^(\.cache/|data/|fixtures/|slides/[^/]+\.(html|pdf)$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  # Secret scanning on every commit, so a key never becomes a commit at all.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # R formatting (Posit air). The hook bundles the air binary.
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.10.0
    hooks:
      - id: air-format

  # Python lint and format for scripts/*.py.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Conventional Commit titles.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # House style: no em dashes anywhere in prose or code. The entry is the
  # YAML escape for U+2014, so this file itself stays clean.
  - repo: local
    hooks:
      - id: no-em-dash
        name: no em dashes
        language: pygrep
        entry: "\u2014"
        files: \.(qmd|md|R|r|py|scss|yml|yaml|toml|sh|txt)$
