<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" font-family="Open Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#404041"/>
    </marker>
  </defs>
  <rect width="1100" height="380" fill="#ffffff"/>

  <!-- request -->
  <rect x="30" y="150" width="170" height="80" rx="6" fill="#F2F2F2" stroke="#404041" stroke-width="1.5"/>
  <text x="115" y="184" text-anchor="middle" font-size="18" font-weight="600" fill="#404041">get_json()</text>
  <text x="115" y="210" text-anchor="middle" font-size="13" fill="#404041" opacity=".75">one request</text>

  <!-- four outcomes -->
  <g font-size="15" fill="#404041">
    <rect x="290" y="30" width="250" height="60" rx="6" fill="#ffffff" stroke="#EE6331" stroke-width="2"/>
    <text x="415" y="55" text-anchor="middle" font-weight="600">transport failed</text>
    <text x="415" y="77" text-anchor="middle" font-size="12" opacity=".75">DNS, refused, timed out</text>

    <rect x="290" y="115" width="250" height="60" rx="6" fill="#ffffff" stroke="#447099" stroke-width="2"/>
    <text x="415" y="140" text-anchor="middle" font-weight="600">non-2xx response</text>
    <text x="415" y="162" text-anchor="middle" font-size="12" opacity=".75">404, 429, 5xx</text>

    <rect x="290" y="200" width="250" height="60" rx="6" fill="#ffffff" stroke="#447099" stroke-width="2"/>
    <text x="415" y="225" text-anchor="middle" font-weight="600">2xx, body unreadable</text>
    <text x="415" y="247" text-anchor="middle" font-size="12" opacity=".75">an HTML maintenance page</text>

    <rect x="290" y="285" width="250" height="60" rx="6" fill="#ffffff" stroke="#72994E" stroke-width="2"/>
    <text x="415" y="310" text-anchor="middle" font-weight="600">2xx, parsed</text>
    <text x="415" y="332" text-anchor="middle" font-size="12" opacity=".75">the answer</text>
  </g>

  <line x1="204" y1="175" x2="286" y2="62" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="204" y1="185" x2="286" y2="145" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="204" y1="195" x2="286" y2="230" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="204" y1="205" x2="286" y2="313" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- envelope -->
  <rect x="640" y="60" width="420" height="260" rx="6" fill="#F2F2F2" stroke="#404041" stroke-width="1.5"/>
  <text x="850" y="95" text-anchor="middle" font-size="20" font-weight="700" fill="#404041">one envelope, always</text>
  <g font-family="Source Code Pro, Consolas, monospace" font-size="15" fill="#404041">
    <text x="670" y="135">ok        TRUE / FALSE</text>
    <text x="670" y="160">status    ok | no_data | stale | rate_limited</text>
    <text x="670" y="182">          | timeout | skipped | error</text>
    <text x="670" y="207">http      200, 404, NA ...</text>
    <text x="670" y="232">data      the parsed body, or NULL</text>
    <text x="670" y="257">error     one sentence for the user</text>
    <text x="670" y="282">detail    the cause, for the log</text>
    <text x="670" y="307">retry_after, ts, source</text>
  </g>

  <line x1="544" y1="60" x2="636" y2="120" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="544" y1="145" x2="636" y2="160" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="544" y1="230" x2="636" y2="200" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="544" y1="315" x2="636" y2="250" stroke="#404041" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="550" y="365" text-anchor="middle" font-size="13" fill="#404041" opacity=".6">only the last outcome is cached; only the first counts against the circuit breaker</text>
</svg>
