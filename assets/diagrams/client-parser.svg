<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" font-family="Open Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#404041"/>
    </marker>
  </defs>
  <rect width="1100" height="340" fill="#ffffff"/>

  <!-- client half -->
  <rect x="40" y="60" width="440" height="200" rx="6" fill="#ffffff" stroke="#447099" stroke-width="3"/>
  <text x="260" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#447099">client half</text>
  <text x="260" y="128" text-anchor="middle" font-family="Source Code Pro, Consolas, monospace" font-size="17" fill="#404041">mygene_gene("TP53")</text>
  <text x="260" y="160" text-anchor="middle" font-size="15" fill="#404041">builds the request, calls biohttp,</text>
  <text x="260" y="182" text-anchor="middle" font-size="15" fill="#404041">hands the body to the parser,</text>
  <text x="260" y="204" text-anchor="middle" font-size="15" fill="#404041">returns the envelope</text>
  <text x="260" y="240" text-anchor="middle" font-size="13" fill="#EE6331" font-weight="600">touches the network</text>

  <!-- parser half -->
  <rect x="620" y="60" width="440" height="200" rx="6" fill="#ffffff" stroke="#72994E" stroke-width="3"/>
  <text x="840" y="98" text-anchor="middle" font-size="22" font-weight="700" fill="#72994E">parser half</text>
  <text x="840" y="128" text-anchor="middle" font-family="Source Code Pro, Consolas, monospace" font-size="17" fill="#404041">mygene_parse_hits(body, "TP53")</text>
  <text x="840" y="160" text-anchor="middle" font-size="15" fill="#404041">takes an already parsed body,</text>
  <text x="840" y="182" text-anchor="middle" font-size="15" fill="#404041">returns a tibble or NULL,</text>
  <text x="840" y="204" text-anchor="middle" font-size="15" fill="#404041">pure and deterministic</text>
  <text x="840" y="240" text-anchor="middle" font-size="13" fill="#72994E" font-weight="600">never touches the network</text>

  <line x1="484" y1="160" x2="616" y2="160" stroke="#404041" stroke-width="2" marker-end="url(#a)"/>
  <text x="550" y="148" text-anchor="middle" font-size="13" fill="#404041" opacity=".75">body</text>

  <!-- fixture -->
  <rect x="700" y="285" width="280" height="40" rx="6" fill="#F2F2F2" stroke="#404041" stroke-width="1.5"/>
  <text x="840" y="311" text-anchor="middle" font-family="Source Code Pro, Consolas, monospace" font-size="14" fill="#404041">fixtures/mygene_tp53.json</text>
  <line x1="840" y1="283" x2="840" y2="266" stroke="#404041" stroke-width="2" marker-end="url(#a)"/>
  <text x="560" y="311" text-anchor="middle" font-size="13" fill="#404041" opacity=".75">a stored response body tests the parser offline</text>
</svg>
