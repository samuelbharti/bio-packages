meta:
  name: bio-packages
  link:
    home: https://www.samuelbharti.com

color:
  palette:
    blue: "#447099"
    teal: "#419599"
    green: "#72994E"
    orange: "#EE6331"
    grey: "#404041"
    light-grey: "#F2F2F2"
  foreground: "#404041"
  background: "#FFFFFF"
  primary: blue
  secondary: grey
  success: green
  info: teal
  warning: orange
  danger: orange

typography:
  # The `fonts:` block is what makes Quarto emit an @import for these families.
  # Without it the family name is set but never loaded, and everything silently
  # falls back to Helvetica. Render once while online so `embed-resources: true`
  # inlines the woff2 payloads into the deck.
  fonts:
    - family: Open Sans
      source: google
      weight: [400, 600, 700]
    - family: Source Code Pro
      source: google
      weight: [400, 600]
  base:
    family: Open Sans
  headings:
    family: Open Sans
    weight: 600
  monospace:
    family: Source Code Pro
